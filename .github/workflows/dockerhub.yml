name: Build and Push Docker Hub Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dockerhub:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_OWNER: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        run: docker build -t local/react-vite-docker:ci .

      - name: Run smoke test container
        run: |
          docker run -d --name react-vite-smoke -p 5173:5173 local/react-vite-docker:ci
          for i in {1..30}; do
            if curl -fsS http://localhost:5173 > /dev/null; then
              echo "Smoke test OK"
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test failed: app did not respond in time"
          docker logs react-vite-smoke || true
          exit 1

      - name: Stop smoke test container
        if: always()
        run: docker rm -f react-vite-smoke || true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_OWNER }}/react-vite-docker:latest
            ${{ env.IMAGE_OWNER }}/react-vite-docker:${{ github.sha }}
