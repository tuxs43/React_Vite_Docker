name: Build and Push Docker Hub Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dockerhub:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_OWNER: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_OWNER }}/react-vite-docker:latest
            ${{ env.IMAGE_OWNER }}/react-vite-docker:${{ github.sha }}
